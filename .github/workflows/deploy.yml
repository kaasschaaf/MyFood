name: Deploy Kost naar GitHub Pages

# Production is the site root and always comes from `main`. The integration
# branch is published next to it under /dev/, so a deploy triggered by either
# branch refreshes both trees and neither can wipe the other.
on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

env:
  PROD_REF: main
  DEV_REF: develop

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # main does not carry the data pipeline yet, so only run it when present.
      - name: Verify static data
        if: hashFiles('scripts/verify-data.js') != ''
        run: node scripts/verify-data.js

  deploy:
    name: Deploy
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Both branches are built, and `git archive` needs their commits.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fetch both branches
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'

      # Pages serves whatever was published last. When the repository is still
      # set to "Deploy from a branch", GitHub's own Jekyll workflow publishes
      # main *after* this job starts and would replace the preview; waiting for
      # it to finish keeps this deployment last. When Pages is set to "GitHub
      # Actions" there is nothing to wait for and the step returns at once.
      - name: Wait for the branch publisher, if any
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 30); do
            state=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=50" \
              --jq '[.workflow_runs[] | select(.name == "pages build and deployment")] | "\(length) \(map(select(.status != "completed")) | length)"' \
              2>/dev/null || echo '0 0')
            total=${state% *}
            pending=${state#* }
            if [ "$total" -gt 0 ] && [ "$pending" -eq 0 ]; then
              echo 'branch publisher finished'
              exit 0
            fi
            if [ "$total" -eq 0 ] && [ "$attempt" -ge 6 ]; then
              echo 'no branch publisher for this commit'
              exit 0
            fi
            sleep 10
          done
          echo '::warning::Still waiting for the branch publisher; publishing anyway.'

      - name: Build site (production + /dev preview)
        env:
          OUT: ${{ github.workspace }}/_site
          AH_API_BASE: ${{ vars.AH_API_PROXY_URL }}
        run: bash .github/scripts/build-site.sh

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # GitHub only serves what the last publisher wrote. If the repository is
      # still set to "Deploy from a branch", its built-in Jekyll workflow
      # republishes main after this job and drops the preview.
      - name: Smoke check the published site
        continue-on-error: true
        env:
          BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          sleep 20
          production=$(curl -s -o /dev/null -w '%{http_code}' "$BASE_URL")
          preview=$(curl -s -o /dev/null -w '%{http_code}' "${BASE_URL}dev/")
          echo "production $production · preview $preview"
          if [ "$preview" != "200" ]; then
            echo "::warning title=Preview not published::${BASE_URL}dev/ returned $preview. Set Settings → Pages → Source to 'GitHub Actions' so this workflow is the only publisher."
          fi
