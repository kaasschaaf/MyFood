name: Deploy Kost naar GitHub Pages

# Production is the site root and always comes from `main`. The integration
# branch is published next to it under /dev/, so a deploy triggered by either
# branch refreshes both trees and neither can wipe the other.
on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

env:
  PROD_REF: main
  DEV_REF: develop

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # main does not carry the data pipeline yet, so only run it when present.
      - name: Verify static data
        if: hashFiles('scripts/verify-data.js') != ''
        run: node scripts/verify-data.js

  deploy:
    name: Deploy
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Both branches are built, and `git archive` needs their commits.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fetch both branches
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Build site (production + /dev preview)
        env:
          OUT: ${{ github.workspace }}/_site
          AH_API_BASE: ${{ vars.AH_API_PROXY_URL }}
        run: bash .github/scripts/build-site.sh

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # GitHub only serves what the last publisher wrote. If the repository is
      # still set to "Deploy from a branch", its built-in Jekyll workflow
      # republishes main after this job and drops the preview.
      - name: Smoke check the published site
        continue-on-error: true
        env:
          BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          sleep 20
          production=$(curl -s -o /dev/null -w '%{http_code}' "$BASE_URL")
          preview=$(curl -s -o /dev/null -w '%{http_code}' "${BASE_URL}dev/")
          echo "production $production · preview $preview"
          if [ "$preview" != "200" ]; then
            echo "::warning title=Preview not published::${BASE_URL}dev/ returned $preview. Set Settings → Pages → Source to 'GitHub Actions' so this workflow is the only publisher."
          fi
