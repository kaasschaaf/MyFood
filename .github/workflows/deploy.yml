name: Deploy Kost naar GitHub Pages

# Production is the site root and always comes from `main`. The integration
# branch is published next to it under /dev/, so a deploy refreshes both trees
# and neither can wipe the other.
#
# The `github-pages` environment only accepts deployments from `main`, so a
# push to `develop` cannot publish by itself: it verifies its own commit and
# then dispatches this workflow on `main`, which rebuilds both branches. The
# environment is only touched by that `main`-ref run.
on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# Never cancel a deployment halfway; queue instead.
concurrency:
  group: 'pages'
  cancel-in-progress: false

env:
  PROD_REF: main
  DEV_REF: develop

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Only some branches carry the data pipeline yet.
      - name: Verify static data
        if: hashFiles('scripts/verify-data.js') != ''
        run: node scripts/verify-data.js

  # A push to any branch other than `main` (that is, `develop`) hands the work
  # to a `main`-ref run, because the Pages environment refuses the rest.
  handoff:
    name: Hand off to main
    needs: verify
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch the Pages deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          gh workflow run deploy.yml --ref main --repo "$REPO"
          echo "Dispatched deploy.yml on main to publish ${{ github.ref_name }}@$SHA"

  deploy:
    name: Deploy
    needs: verify
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Both branches are built, and `git archive` needs their commits.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fetch both branches
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'

      # Pages serves whatever was published last. When the repository is still
      # set to "Deploy from a branch", GitHub's own Jekyll workflow publishes
      # main *after* this job starts and would replace the preview; waiting for
      # it to finish keeps this deployment last. When Pages is set to "GitHub
      # Actions" there is nothing to wait for and the step returns at once.
      - name: Wait for the branch publisher, if any
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 30); do
            state=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=50" \
              --jq '[.workflow_runs[] | select(.name == "pages build and deployment")] | "\(length) \(map(select(.status != "completed")) | length)"' \
              2>/dev/null || echo '0 0')
            total=${state% *}
            pending=${state#* }
            if [ "$total" -gt 0 ] && [ "$pending" -eq 0 ]; then
              echo 'branch publisher finished'
              exit 0
            fi
            if [ "$total" -eq 0 ] && [ "$attempt" -ge 6 ]; then
              echo 'no branch publisher for this commit'
              exit 0
            fi
            sleep 10
          done
          echo '::warning::Still waiting for the branch publisher; publishing anyway.'

      - name: Build site (production + /dev preview)
        env:
          OUT: ${{ github.workspace }}/_site
          AH_API_BASE: ${{ vars.AH_API_PROXY_URL }}
        run: bash .github/scripts/build-site.sh

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Reports what is actually live, so a silently missing preview is visible
      # in the run instead of only in the browser.
      - name: Smoke check the published site
        env:
          BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in $(seq 1 10); do
            production=$(curl -s -o /dev/null -w '%{http_code}' "$BASE_URL")
            preview=$(curl -s -o /dev/null -w '%{http_code}' "${BASE_URL}dev/")
            echo "attempt $attempt: production $production · preview $preview"
            [ "$production" = "200" ] && [ "$preview" = "200" ] && exit 0
            sleep 15
          done
          echo "::error title=Preview not published::${BASE_URL}dev/ returned $preview after deploy."
          exit 1
