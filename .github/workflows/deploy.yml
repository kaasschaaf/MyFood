name: Deploy Kost naar GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Verify static data
        run: node scripts/verify-data.js

      - name: Configure AH API proxy
        env:
          AH_API_PROXY_URL: ${{ vars.AH_API_PROXY_URL }}
        run: |
          node -e "const fs=require('node:fs');const cfg='// This file is regenerated at deploy time by .github/workflows/deploy.yml.\nglobalThis.MYFOOD_AH_API_BASE = '+JSON.stringify(process.env.AH_API_PROXY_URL || '')+';\nglobalThis.MYFOOD_BUILD_TIME = '+JSON.stringify(new Date().toISOString())+';\n';fs.writeFileSync('js/runtime-config.js',cfg)"

      - name: Build Tailwind CSS
        run: npm run build:css

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


